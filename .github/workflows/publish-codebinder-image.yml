name: Publish CodeBinder Builder Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/ghcr-pdf
    paths:
      - docker/codebinder-pdf/Dockerfile
      - .github/workflows/publish-codebinder-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: codebinder-builder-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/scottchiunyc/art-codebinder-pdf

jobs:
  build-publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out ART
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/codebinder-pdf/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Record immutable digest
        shell: bash
        run: |
          set -euo pipefail
          echo "Image: ${IMAGE_NAME}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Smoke-test published image
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm "$image" bash -lc '
            set -euo pipefail
            python --version
            pandoc --version | head -n 1
            xelatex --version | head -n 1
            lualatex --version | head -n 1
            pdftotext -v 2>&1 | head -n 1
            fc-match "Noto Serif CJK SC" | head -n 1
            python - <<'"'"'PY'"'"'
import googleapiclient
import nbsphinx
import sphinx
import sphinx_copybutton
print("Python PDF dependencies import successfully")
PY
          '
