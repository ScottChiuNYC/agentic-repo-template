name: Validate AI Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-infra-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python -m py_compile tools/check_markdown_math.py tools/*.py tools/sphinx/conf.py
          bash -n bootstrap/new_repo.sh
          bash -n tools/reference_ingest_ocr.sh
          bash -n tools/reference_ingest_commit.sh
      - name: Validate Markdown
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t markdown < <(git ls-files '*.md')
          if (( ${#markdown[@]} > 0 )); then
            python tools/check_markdown_math.py "${markdown[@]}"
          fi
